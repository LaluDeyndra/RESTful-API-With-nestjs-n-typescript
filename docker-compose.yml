version: '3.9'

services:
  nestapp:
    container_name: nestapp
    image: laludeyndra/nestapi:1.0
    build: .
    ports:
      - '3000:3000'
    environment:
      - DB_TYPE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=restful-api
      - DB_NAME=db_nestjs
    depends_on:
      - db

  db:
    container_name: db
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: restful-api
      MYSQL_DATABASE: db_nestjs
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata: {}
